<script>
const LEG="fitlife_v1",UK="fitlife_users",SK="fitlife_session";let KEY="fitlife_none";
const TABS=[["td","🏠","Today"],["wo","🏋️","Workout"],["bmi","⚖️","BMI"],["act","👟","Activity"],["tip","💡","Tips"],["wat","💧","Water"],["slp","🌙","Sleep"],["pro","👤","Profile"]];
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SES={
cardio:["Cardio",[["Brisk walk or jog","20 min"],["Jumping jacks","3 × 40 sec"],["High knees","3 × 30 sec"],["Cool-down stretch","5 min"]]],
upper:["Upper body",[["Push-ups","3 × 10"],["Dumbbell rows","3 × 12"],["Shoulder press","3 × 10"],["Tricep dips","3 × 10"]]],
lower:["Lower body",[["Squats","3 × 15"],["Lunges","3 × 10 each leg"],["Glute bridges","3 × 15"],["Calf raises","3 × 20"]]],
core:["Core",[["Plank","3 × 40 sec"],["Crunches","3 × 15"],["Russian twists","3 × 20"],["Leg raises","3 × 12"]]],
hiit:["HIIT",[["Burpees","4 rounds × 30 sec"],["Mountain climbers","4 rounds × 30 sec"],["Squat jumps","4 rounds × 30 sec"],["Skaters","4 rounds × 30 sec"]]],
yoga:["Yoga & stretch",[["Sun salutations","5 rounds"],["Cat-cow","1 min"],["Child’s pose","2 min"],["Hamstring stretch","1 min each side"]]],

const SCH={lose:["hiit","lower","cardio","upper","hiit","cardio","rest"],build:["upper","lower","rest","upper","lower","core","yoga"],fit:["cardio","upper","yoga","lower","core","cardio","rest"]};
const GOALS={lose:"Lose weight",build:"Build muscle",fit:"Stay fit"};
const MET={"Walking":3.5,"Running":9,"Cycling":7,"Swimming":6,"Strength training":5,"Yoga":2.5,"Badminton / Football":6,"HIIT":8};
const TIPS=[["Exercise","Aim for 150 minutes a week","Moderate activity like brisk walking, five days a week, lowers the risk of heart disease, type 2 diabetes and high blood pressure."],
["Exercise","Strength twice a week","Muscle work keeps bones dense, speeds up metabolism and protects your joints as you age."],
["Exercise","Warm up, cool down","Five minutes before and after cuts injury risk and helps your heart rate settle."],
["Nutrition","Fill half your plate with vegetables","Fibre keeps you full for longer and supports digestion. Add protein and whole grains for the rest."],
["Nutrition","Cut back on sugary drinks","Teh tarik, soft drinks and packaged juice add calories quickly. Water or unsweetened tea is an easy swap."],
["Nutrition","Eat protein after training","Eggs, fish, tempeh, chicken or yoghurt help muscles repair and grow."],
["Hydration","Drink before you feel thirsty","Even mild dehydration lowers focus and energy. Keep a bottle close and sip all day."],
["Sleep","Keep a regular schedule","Sleeping and waking at similar times every day improves sleep quality and mood."],
["Sleep","Screens off 30 minutes before bed","Blue light delays the sleep hormone melatonin. Read or stretch instead."],
["Mind","Move to manage stress","A 10-minute walk can lift mood. Regular activity is linked to lower anxiety and better focus."]];
const BENEFIT={Exercise:"💪",Nutrition:"🥗",Hydration:"💧",Sleep:"😴",Mind:"🧘"};

const D=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=()=>D();
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
return Object.assign({p:{name:"",age:"",sex:"",h:"",w:"",goal:"fit",wGoal:2000,sGoal:8,stepGoal:8000},water:{},act:[],steps:{},sleep:{},done:{}},s||{})}
try{const _s=localStorage.getItem(SK);if(_s&&getU()[_s])KEY="fitlife_u_"+_s}catch(e){}
let S=load(),tab="td",wd=(new Date().getDay()+6)%7;

function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
const $=id=>document.getElementById(id);
function dateOfWd(i){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);return D(d)}

function chart(vals,color,max,unit){const m=Math.max(max,...vals.map(v=>v[1]));return '<div class="chart">'+vals.map(v=>`<div><span>${v[1]?Math.round(v[1]*10)/10:""}</span><i style="height:${Math.max(2,v[1]/m*80)}%;background:${color};opacity:${v[2]?1:.55}"></i>${v[0]}</div>`).join("")+"</div>"}

/* WORKOUT */
function vWo(){const g=S.p.goal,key=SCH[g][wd],s=SES[key],date=dateOfWd(wd);
const dn=S.done[date]||[];const total=s[1].length,n=s[1].filter((_,i)=>dn.includes(i)).length;
return `<div class="card"><h2>Your goal</h2><div class="chips">${Object.keys(GOALS).map(k=>`<button class="chip ${k==g?"on":""}" onclick="setGoal('${k}')">${GOALS[k]}</button>`).join("")}</div>
<div class="chips" style="margin:0">${DAYS.map((d,i)=>`<button class="chip ${i==wd?"on":""}" onclick="wd=${i};R()">${d}</button>`).join("")}</div></div>
<div class="card c"><h2>Workout timer</h2><div class="big" id="tm">${fmt(T.s)}</div><div class="row" style="margin-top:14px"><button class="b" onclick="tToggle()">${T.on?"Pause":T.s?"Resume":"Start"}</button><button class="g" onclick="tFinish()">Finish and log</button></div><p class="note">About ${Math.round((key=="hiit"?8:key=="yoga"||key=="rest"?2.8:5)*(parseFloat(S.p.w)||65)*0.5)} kcal for a 30-minute ${s[0].toLowerCase()} session</p></div>
<div class="card"><h2>${s[0]}</h2><p class="mut" style="margin:-6px 0 8px">${DAYS[wd]} · ${n} of ${total} done</p><div class="bar" style="margin-bottom:6px"><i style="width:${n/total*100}%"></i></div>
${s[1].map((e,i)=>`<label class="ex ${dn.includes(i)?"done":""}" style="margin:0;color:inherit;font-size:15px"><input type="checkbox" ${dn.includes(i)?"checked":""} onchange="tgl('${date}',${i})"><span><b>${e[0]}</b><small>${e[1]}</small></span></label>`).join("")}
${n==total?'<p class="c" style="margin:12px 0 0;font-weight:700;color:var(--pri)">Session complete. Great work!</p>':""}</div>`}
function setGoal(k){S.p.goal=k;save();R()}
function tgl(d,i){const a=S.done[d]||(S.done[d]=[]);const x=a.indexOf(i);x<0?a.push(i):a.splice(x,1);save();R()}

/* BMI */
function bmiCat(b){return b<18.5?["Underweight","#4F9DDE"]:b<25?["Healthy weight","#3FAE6A"]:b<30?["Overweight","#E5B53A"]:["Obese","#C2362B"]}
function vBmi(){return `<div class="card"><h2>Calculate your BMI</h2>
<div class="row"><div><label for="bh">Height (cm)</label><input id="bh" type="number" inputmode="decimal" value="${S.p.h}"></div><div><label for="bw">Weight (kg)</label><input id="bw" type="number" inputmode="decimal" value="${S.p.w}"></div></div>
<p style="margin:14px 0 0"><button class="b" onclick="calc()">Calculate BMI</button></p></div><div id="bres"></div>${S.p.h&&S.p.w?"<script>calc(true)<\/script>":""}`}
function calc(q){const h=parseFloat($("bh").value),w=parseFloat($("bw").value);
if(!(h>50&&h<260&&w>10&&w<400)){$("bres").innerHTML='<div class="card" style="color:var(--bad)">Enter a height between 50–260 cm and a weight between 10–400 kg.</div>';return}
const b=w/((h/100)**2),c=bmiCat(b),pos=Math.min(100,Math.max(0,(b-15)/25*100));
const lo=(18.5*(h/100)**2).toFixed(1),hi=(24.9*(h/100)**2).toFixed(1);
$("bres").innerHTML=`<div class="card c"><div class="big" style="color:${c[1]}">${b.toFixed(1)}</div><h2 style="margin-top:6px">${c[0]}</h2>
<div class="gauge"><i style="left:${pos}%"></i></div><div style="display:flex;justify-content:space-between;font-size:11px" class="mut"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
<p class="mut" style="margin:12px 0 0">A healthy weight for your height is about ${lo}–${hi} kg.</p>
